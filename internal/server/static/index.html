<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST RADIO</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #06080b;
    color: #7a9ab8;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  #grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 10;
    mix-blend-mode: screen;
  }
  #grain.active { opacity: 1; }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(2,4,8,0.9) 100%);
    z-index: 0;
  }

  .station {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  .title {
    font-size: clamp(2.4rem, 8vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.45em;
    color: #b8d4ee;
    text-shadow:
      0 0 30px rgba(120, 170, 220, 0.35),
      0 0 80px rgba(80, 130, 190, 0.12);
  }
  .title.receiving { animation: signal-flicker 9s ease-in-out infinite; }
  @keyframes signal-flicker {
    0%, 93%, 100% { opacity: 1; }
    94%  { opacity: 0.55; }
    95%  { opacity: 0.9; }
    96%  { opacity: 0.4; }
    97%  { opacity: 1; }
  }

  .subtitle {
    font-size: clamp(0.52rem, 1.6vw, 0.72rem);
    letter-spacing: 0.5em;
    color: #1e3048;
    margin-top: -1.6rem;
  }

  .divider { width: 100%; border: none; border-top: 1px solid #0c1620; }

  #year-display {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #4a70a0;
    min-width: 8ch;
    text-align: center;
  }
  #year-display.locked {
    color: #8ab4d8;
    text-shadow: 0 0 30px rgba(100, 160, 220, 0.3);
    transition: color 0.4s, text-shadow 0.4s;
  }

  /* Source metadata */
  #meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    min-height: 2.8rem;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #meta.visible { opacity: 1; }

  #meta-title {
    font-size: clamp(0.6rem, 1.8vw, 0.78rem);
    letter-spacing: 0.2em;
    color: #5a80a0;
    max-width: 36ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #meta-link {
    font-size: clamp(0.5rem, 1.4vw, 0.62rem);
    letter-spacing: 0.25em;
    color: #1e3048;
    text-decoration: none;
    transition: color 0.2s;
  }
  #meta-link:hover { color: #5a80a0; }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
  }

  #status {
    font-size: 0.68rem;
    letter-spacing: 0.5em;
    color: #1e3048;
    height: 1.2em;
    transition: color 0.4s;
  }
  #status.receiving { color: #5a80a8; }
  #status .dot { display: inline-block; }
  #status.receiving .dot { animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { opacity: 0.15; }
    50%       { opacity: 1; }
  }

  #tune-btn {
    background: none;
    border: 1px solid #122030;
    color: #3a5878;
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.5em;
    padding: 0.7rem 2.5rem;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
  }
  #tune-btn:hover {
    border-color: #5a80a8;
    color: #b8d4ee;
    box-shadow: 0 0 24px rgba(80, 130, 190, 0.12);
  }
  #tune-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<canvas id="grain"></canvas>
<div class="vignette"></div>

<div class="station">
  <div>
    <div class="title" id="title">GHOST RADIO</div>
    <div class="subtitle">UNKNOWN SIGNAL · 1900—1980</div>
  </div>

  <hr class="divider">

  <div id="year-display">——</div>

  <div id="meta">
    <div id="meta-title"></div>
    <a id="meta-link" href="#" target="_blank" rel="noopener"></a>
  </div>

  <div class="controls">
    <div id="status"><span class="dot">◌</span>&nbsp;IDLE</div>
    <button id="tune-btn">TUNE IN</button>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';

  // ── TV static ───────────────────────────────────────────────────────────────
  const canvas = document.getElementById('grain');
  const ctx    = canvas.getContext('2d');
  let grainTimer = null;

  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawStatic() {
    const w = canvas.width, h = canvas.height;
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      if (Math.random() < 0.055) {
        const v = 160 + (Math.random() * 95 | 0);
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 25 + (Math.random() * 40 | 0);
      }
    }
    ctx.putImageData(img, 0, 0);
    grainTimer = setTimeout(() => requestAnimationFrame(drawStatic), 80);
  }

  function startGrain() { canvas.classList.add('active'); drawStatic(); }
  function stopGrain()  {
    canvas.classList.remove('active');
    clearTimeout(grainTimer); grainTimer = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // ── Year display — erratic jumps ────────────────────────────────────────────
  const yearEl = document.getElementById('year-display');
  let yearTimer = null;
  let lockedYear = null;   // set when real metadata arrives
  let lockTimer  = null;   // clears lockedYear after a few seconds

  function randomYear() { return 1900 + Math.floor(Math.random() * 81); }

  function jumpYear() {
    if (lockedYear !== null) {
      yearEl.textContent = lockedYear;
    } else {
      // Erratic: mostly fast random jumps, occasionally the same year twice
      yearEl.textContent = Math.random() < 0.15 ? yearEl.textContent : randomYear();
    }
    // Interval: 120–600ms — feels like scanning, not counting
    yearTimer = setTimeout(jumpYear, 120 + Math.random() * 480);
  }

  function startYear() { jumpYear(); }
  function stopYear()  {
    clearTimeout(yearTimer); yearTimer = null;
    clearTimeout(lockTimer);  lockTimer = null;
    lockedYear = null;
    yearEl.classList.remove('locked');
    yearEl.textContent = '——';
  }

  // Flash the real year brightly for ~5 s, then resume jumping
  function lockYear(year) {
    if (!year) return;
    lockedYear = year;
    yearEl.classList.add('locked');
    clearTimeout(lockTimer);
    lockTimer = setTimeout(() => {
      lockedYear = null;
      yearEl.classList.remove('locked');
    }, 5000);
  }

  // ── Metadata panel ──────────────────────────────────────────────────────────
  const metaEl      = document.getElementById('meta');
  const metaTitleEl = document.getElementById('meta-title');
  const metaLinkEl  = document.getElementById('meta-link');
  let pollTimer     = null;
  let lastId        = '';

  function showMeta(data) {
    if (!data.identifier || data.identifier === lastId) return;
    lastId = data.identifier;

    metaTitleEl.textContent = data.title || data.identifier;
    metaLinkEl.textContent  = data.identifier;
    metaLinkEl.href         = data.archive_url || '#';

    metaEl.classList.remove('visible');
    // Small delay so the fade-in triggers reliably
    setTimeout(() => metaEl.classList.add('visible'), 30);

    lockYear(data.year);
  }

  function clearMeta() {
    metaEl.classList.remove('visible');
    lastId = '';
  }

  function pollNow() {
    fetch('/now')
      .then(r => r.json())
      .then(data => { if (playing) showMeta(data); })
      .catch(() => {});
    pollTimer = setTimeout(pollNow, 4000);
  }

  function startPoll() { pollNow(); }
  function stopPoll()  { clearTimeout(pollTimer); pollTimer = null; }

  // ── Audio & UI ──────────────────────────────────────────────────────────────
  const audio  = document.getElementById('audio');
  const btn    = document.getElementById('tune-btn');
  const status = document.getElementById('status');
  const title  = document.getElementById('title');
  let playing  = false;

  function setReceiving(on) {
    if (on) {
      status.className = 'receiving';
      status.innerHTML = '<span class="dot">◌</span>&nbsp;RECEIVING';
      btn.textContent  = 'TUNE OUT';
      title.classList.add('receiving');
    } else {
      status.className = '';
      status.innerHTML = '<span class="dot">◌</span>&nbsp;IDLE';
      btn.textContent  = 'TUNE IN';
      title.classList.remove('receiving');
    }
  }

  function tuneIn() {
    playing = true;
    setReceiving(true);
    startGrain();
    startYear();
    startPoll();
    audio.src = '/listen';
    audio.play().catch(() => {});
  }

  function tuneOut() {
    playing = false;
    setReceiving(false);
    stopGrain();
    stopYear();
    stopPoll();
    clearMeta();
    audio.pause();
    audio.src = '';
  }

  btn.addEventListener('click', () => { if (playing) tuneOut(); else tuneIn(); });
  audio.addEventListener('ended', tuneOut);
  audio.addEventListener('error', tuneOut);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST RADIO</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #06080b;
    color: #7a9ab8;
    font-family: 'Courier New', Courier, monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  /* TV static — sparse bright flashes on dark canvas, screen blend */
  #grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 10;
    mix-blend-mode: screen;
  }
  #grain.active { opacity: 1; }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(2,4,8,0.9) 100%);
    z-index: 0;
  }

  .station {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.2rem;
  }

  .title {
    font-size: clamp(2.4rem, 8vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.45em;
    color: #b8d4ee;
    text-shadow:
      0 0 30px rgba(120, 170, 220, 0.35),
      0 0 80px rgba(80, 130, 190, 0.12);
  }

  .title.receiving {
    animation: signal-flicker 9s ease-in-out infinite;
  }

  @keyframes signal-flicker {
    0%, 93%, 100% { opacity: 1; }
    94%  { opacity: 0.55; }
    95%  { opacity: 0.9; }
    96%  { opacity: 0.4; }
    97%  { opacity: 1; }
  }

  .subtitle {
    font-size: clamp(0.52rem, 1.6vw, 0.72rem);
    letter-spacing: 0.5em;
    color: #1e3048;
    margin-top: -1.8rem;
  }

  .divider {
    width: 100%;
    border: none;
    border-top: 1px solid #0c1620;
  }

  #year-display {
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #4a70a0;
    min-width: 8ch;
    text-align: center;
    transition: color 0.6s;
  }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
  }

  #status {
    font-size: 0.68rem;
    letter-spacing: 0.5em;
    color: #1e3048;
    height: 1.2em;
    transition: color 0.4s;
  }

  #status.receiving { color: #5a80a8; }

  #status .dot { display: inline-block; }

  #status.receiving .dot {
    animation: breathe 3s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.15; }
    50%       { opacity: 1; }
  }

  #tune-btn {
    background: none;
    border: 1px solid #122030;
    color: #3a5878;
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.5em;
    padding: 0.7rem 2.5rem;
    cursor: pointer;
    transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
  }

  #tune-btn:hover {
    border-color: #5a80a8;
    color: #b8d4ee;
    box-shadow: 0 0 24px rgba(80, 130, 190, 0.12);
  }

  #tune-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<canvas id="grain"></canvas>
<div class="vignette"></div>

<div class="station">
  <div>
    <div class="title" id="title">GHOST RADIO</div>
    <div class="subtitle">UNKNOWN SIGNAL · 1900—1980</div>
  </div>

  <hr class="divider">

  <div id="year-display">——</div>

  <div class="controls">
    <div id="status"><span class="dot">◌</span>&nbsp;IDLE</div>
    <button id="tune-btn">TUNE IN</button>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';

  // ── TV static ───────────────────────────────────────────────────────────────
  const canvas = document.getElementById('grain');
  const ctx    = canvas.getContext('2d');
  let grainTimer = null;

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawStatic() {
    const w = canvas.width, h = canvas.height;
    const img = ctx.createImageData(w, h);
    const d   = img.data;
    for (let i = 0; i < d.length; i += 4) {
      // Sparse bright flashes — most pixels stay dark (transparent)
      if (Math.random() < 0.055) {
        const v = 160 + (Math.random() * 95 | 0);
        d[i] = d[i+1] = d[i+2] = v;
        d[i+3] = 25 + (Math.random() * 40 | 0);
      }
      // else d[i+3] stays 0 — fully transparent
    }
    ctx.putImageData(img, 0, 0);
    grainTimer = setTimeout(() => requestAnimationFrame(drawStatic), 80); // ~12 fps
  }

  function startGrain() { canvas.classList.add('active'); drawStatic(); }
  function stopGrain()  {
    canvas.classList.remove('active');
    clearTimeout(grainTimer);
    grainTimer = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // ── Year drift with digit glitch ────────────────────────────────────────────
  let yearFloat = 1920 + Math.random() * 40;
  let yearDrift = (Math.random() - 0.5) * 0.45;
  let yearTimer = null;
  let glitchCooldown = 0;

  const yearEl = document.getElementById('year-display');

  function tickYear() {
    yearFloat += yearDrift;
    if (yearFloat < 1900) { yearFloat = 1900; yearDrift =  Math.abs(yearDrift); }
    if (yearFloat > 1980) { yearFloat = 1980; yearDrift = -Math.abs(yearDrift); }
    if (Math.random() < 0.007) yearDrift += (Math.random() - 0.5) * 0.5;
    yearDrift = Math.max(-1.5, Math.min(1.5, yearDrift));

    if (glitchCooldown <= 0 && Math.random() < 0.025) {
      // Flash a wrong year for 70ms, then snap back
      const ghost = Math.round(yearFloat) + Math.floor((Math.random() - 0.5) * 24);
      yearEl.textContent = ghost;
      yearEl.style.opacity = '0.35';
      glitchCooldown = 10;
      setTimeout(() => {
        yearEl.textContent = Math.round(yearFloat);
        yearEl.style.opacity = '';
      }, 70);
    } else {
      if (glitchCooldown > 0) glitchCooldown--;
      yearEl.textContent = Math.round(yearFloat);
    }
    yearTimer = setTimeout(tickYear, 130);
  }

  function startYear() { tickYear(); }
  function stopYear()  {
    clearTimeout(yearTimer);
    yearTimer = null;
    yearEl.textContent = '——';
    yearEl.style.opacity = '';
  }

  // ── Audio & UI ──────────────────────────────────────────────────────────────
  const audio  = document.getElementById('audio');
  const btn    = document.getElementById('tune-btn');
  const status = document.getElementById('status');
  const title  = document.getElementById('title');
  let playing  = false;

  function setReceiving(on) {
    if (on) {
      status.className = 'receiving';
      status.innerHTML = '<span class="dot">◌</span>&nbsp;RECEIVING';
      btn.textContent  = 'TUNE OUT';
      title.classList.add('receiving');
    } else {
      status.className = '';
      status.innerHTML = '<span class="dot">◌</span>&nbsp;IDLE';
      btn.textContent  = 'TUNE IN';
      title.classList.remove('receiving');
    }
  }

  function tuneIn() {
    playing = true;
    setReceiving(true);
    startGrain();
    startYear();
    audio.src = '/listen';
    audio.play().catch(() => {});
  }

  function tuneOut() {
    playing = false;
    setReceiving(false);
    stopGrain();
    stopYear();
    audio.pause();
    audio.src = '';
  }

  btn.addEventListener('click', () => { if (playing) tuneOut(); else tuneIn(); });
  audio.addEventListener('ended', tuneOut);
  audio.addEventListener('error', tuneOut);
})();
</script>
</body>
</html>
